<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Physics Problem Solver</title>
</head>
<body>
    <main>
        <div class="mainbox">
            <div class="inputbox">
                <h2>Question</h2>
                <p>What quantities are given in the question?</p>
                <div id="table-inputs"></div>

                <h2>Add input</h2>
                <div class="searcharea">
                    <input id="input-search" class="search" placeholder="Search quantities">
                    <div id="button-search-clear" class="tr-close" tabindex="0">X</div>
                </div>
                <div id="table-search"></div>
                <button id="button-inputs-all">All quantities</button>
            </div>
            <div class="divider"></div>
            <div class="answerbox">
                <h2>Answer</h2>
                <p>What quantity do you want to calculate?</p>
                <div id="table-answer"></div>

                <!--<h2>Calculation</h2>-->

                <!--<label><input id="simpleview" type="checkbox">Simple View</label>-->
            </div>
        </div>
    </main>

    <script src="script.js"></script>

    <div class="footer">
        <h1>Physics Problem Solver</h1>
        <p>By&nbsp;<a href="https://miles.knightpuzzle.com">Miles</a></p>
    </div>
</body>
</html>
